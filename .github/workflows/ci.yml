name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Testes das regras do banco
        run: PGURL=postgres://postgres:postgres@localhost:5432/postgres supabase/tests/run.sh

  painel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Lint, tipos e build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: exemplo

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Na main, o APK é assinado sempre com a mesma chave (guardada num bucket privado do
      # Supabase) e publicado num link fixo para os colaboradores baixarem.
      - name: Preparar publicação
        id: pub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "sem SUPABASE_ACCESS_TOKEN, não publica"; exit 0; }
          npx -y supabase@2.122.0 --version >/dev/null
          REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\.supabase\.co.*#\1#')
          CHAVE=$(npx -y supabase@2.122.0 projects api-keys --project-ref "$REF" -o json | jq -r '.[] | select(.name == "service_role") | .api_key')
          [ -n "$CHAVE" ] && [ "$CHAVE" != null ] || { echo "não achei a chave service_role"; exit 1; }
          echo "::add-mask::$CHAVE"
          echo "chave=$CHAVE" >> "$GITHUB_OUTPUT"
          H=(-H "Authorization: Bearer $CHAVE" -H "apikey: $CHAVE")
          # buckets: "app" (público, só o APK) e "interno" (privado, a chave de assinatura)
          curl -s "${H[@]}" -H "Content-Type: application/json" -X POST "$SUPABASE_URL/storage/v1/bucket" \
            -d '{"id":"app","name":"app","public":true}' >/dev/null
          curl -s "${H[@]}" -H "Content-Type: application/json" -X POST "$SUPABASE_URL/storage/v1/bucket" \
            -d '{"id":"interno","name":"interno","public":false}' >/dev/null
          K="$RUNNER_TEMP/ponto.keystore"
          S="$RUNNER_TEMP/senha.txt"
          O="$SUPABASE_URL/storage/v1/object/interno/assinatura"
          if curl -sf "${H[@]}" -o "$K" "$O/ponto.keystore" && curl -sf "${H[@]}" -o "$S" "$O/senha.txt"; then
            echo "chave de assinatura baixada"
          else
            echo "primeira vez: criando a chave de assinatura"
            rm -f "$K"
            openssl rand -hex 24 > "$S"
            keytool -genkeypair -keystore "$K" -storetype PKCS12 -alias ponto -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$(cat "$S")" -keypass "$(cat "$S")" -dname "CN=Ponto, O=Ponto, C=BR"
            curl -sf "${H[@]}" -H "Content-Type: application/octet-stream" -X POST --data-binary @"$K" "$O/ponto.keystore"
            curl -sf "${H[@]}" -H "Content-Type: text/plain" -X POST --data-binary @"$S" "$O/senha.txt"
          fi
          echo "::add-mask::$(cat "$S")"
          echo "PONTO_KEYSTORE=$K" >> "$GITHUB_ENV"
          echo "PONTO_KEYSTORE_SENHA=$(cat "$S")" >> "$GITHUB_ENV"
      - name: Gerar APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ponto-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Publicar o APK no link de download
        if: steps.pub.outputs.chave != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CHAVE: ${{ steps.pub.outputs.chave }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          curl -sf -H "Authorization: Bearer $CHAVE" -H "apikey: $CHAVE" -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" -H "cache-control: max-age=60" \
            -X POST --data-binary @"$APK" "$SUPABASE_URL/storage/v1/object/app/ponto.apk"
          URL="$SUPABASE_URL/storage/v1/object/public/app/ponto.apk"
          curl -sfI "$URL" | head -5
          echo "### APK publicado: $URL" >> "$GITHUB_STEP_SUMMARY"
