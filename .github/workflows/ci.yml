name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Testes das regras do banco
        run: PGURL=postgres://postgres:postgres@localhost:5432/postgres supabase/tests/run.sh

  painel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Lint, tipos e build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: exemplo

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Na main, o APK é assinado sempre com a mesma chave (guardada num bucket privado do
      # Supabase) e publicado num link fixo para os colaboradores baixarem.
      - name: Preparar publicação
        id: pub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          # chave secreta do projeto (Settings > API Keys > sb_secret_...), cadastrada como secret do GitHub
          CHAVE="$SUPABASE_SECRET_KEY"
          if [ -z "$CHAVE" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\.supabase\.co.*#\1#')
            CHAVES=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true")
            CHAVE=$(echo "$CHAVES" | jq -r 'if type == "array" then ([.[] | select(.type == "secret" or .name == "service_role")][0].api_key // empty) else empty end')
          fi
          if [ -z "$CHAVE" ]; then
            echo "::warning::Sem SUPABASE_SECRET_KEY: o APK não foi publicado no link de download"
            exit 0
          fi
          echo "::add-mask::$CHAVE"
          if ! curl -s -o /dev/null --max-time 20 "$SUPABASE_URL/rest/v1/"; then
            echo "::warning::O Supabase não respondeu (projeto pausado?): o APK não foi publicado no link de download"
            exit 0
          fi
          # chave nova (sb_secret_) vai só no cabeçalho apikey; a antiga (JWT) também no Authorization
          if [[ "$CHAVE" == sb_* ]]; then H=(-H "apikey: $CHAVE"); else H=(-H "Authorization: Bearer $CHAVE" -H "apikey: $CHAVE"); fi
          # buckets: "app" (público, só o APK) e "interno" (privado, a chave de assinatura)
          curl -s "${H[@]}" -H "Content-Type: application/json" -X POST "$SUPABASE_URL/storage/v1/bucket" \
            -d '{"id":"app","name":"app","public":true}' >/dev/null
          curl -s "${H[@]}" -H "Content-Type: application/json" -X POST "$SUPABASE_URL/storage/v1/bucket" \
            -d '{"id":"interno","name":"interno","public":false}' >/dev/null
          K="$RUNNER_TEMP/ponto.keystore"
          S="$RUNNER_TEMP/senha.txt"
          O="$SUPABASE_URL/storage/v1/object/interno/assinatura"
          if curl -sf "${H[@]}" -o "$K" "$O/ponto.keystore" && curl -sf "${H[@]}" -o "$S" "$O/senha.txt"; then
            echo "chave de assinatura baixada"
          else
            echo "primeira vez: criando a chave de assinatura"
            rm -f "$K"
            openssl rand -hex 24 > "$S"
            keytool -genkeypair -keystore "$K" -storetype PKCS12 -alias ponto -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$(cat "$S")" -keypass "$(cat "$S")" -dname "CN=Ponto, O=Ponto, C=BR"
            curl -sf "${H[@]}" -H "Content-Type: application/octet-stream" -X POST --data-binary @"$K" "$O/ponto.keystore"
            curl -sf "${H[@]}" -H "Content-Type: text/plain" -X POST --data-binary @"$S" "$O/senha.txt"
          fi
          echo "::add-mask::$(cat "$S")"
          echo "PONTO_KEYSTORE=$K" >> "$GITHUB_ENV"
          echo "PONTO_KEYSTORE_SENHA=$(cat "$S")" >> "$GITHUB_ENV"
          echo "chave=$CHAVE" >> "$GITHUB_OUTPUT"
      - name: Gerar APK
        # com a chave fixa gera a versão final (release); sem ela, a de teste (debug)
        run: ./gradlew $([ -n "$PONTO_KEYSTORE" ] && echo assembleRelease || echo assembleDebug) --no-daemon
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ponto-apk
          path: android/app/build/outputs/apk/*/*.apk
      - name: Publicar o APK no link de download
        if: steps.pub.outputs.chave != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          CHAVE: ${{ steps.pub.outputs.chave }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if [[ "$CHAVE" == sb_* ]]; then H=(-H "apikey: $CHAVE"); else H=(-H "Authorization: Bearer $CHAVE" -H "apikey: $CHAVE"); fi
          curl -sf "${H[@]}" -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" -H "cache-control: max-age=60" \
            -X POST --data-binary @"$APK" "$SUPABASE_URL/storage/v1/object/app/ponto.apk"
          URL="$SUPABASE_URL/storage/v1/object/public/app/ponto.apk"
          curl -sfI "$URL" | head -5
          echo "### APK publicado: $URL" >> "$GITHUB_STEP_SUMMARY"
